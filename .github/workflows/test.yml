name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate .
      - run: statusline/test.sh
      # Plugin checks (`claude plugin validate|test plugins/cache-warmer`) are not run here:
      # GitHub-hosted runners reject the early-access hooks module even though the same
      # files and versions pass on a workstation. Run them locally before every release.
